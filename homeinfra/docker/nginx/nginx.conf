events {}

http {
    client_max_body_size 0;
    proxy_buffering off;

    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;

    ################################################################
    # Upstreams
    ################################################################

    upstream docker-private {
        server registry-private:5000;
    }

    upstream docker-cache {
        server registry-cache:5000;
    }

    upstream pypi-cache {
        server pypi-cache:3141;
    }

    ################################################################
    # Redirect HTTP → HTTPS
    ################################################################

    server {
        listen 80;
        server_name reg.home.arpa cache.home.arpa pypi.home.arpa;

        return 301 https://$host$request_uri;
    }

    ################################################################
    # PRIVATE DOCKER REGISTRY
    ################################################################

    server {
        listen 443 ssl;
        http2 on;
        server_name reg.home.arpa;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        auth_basic "Docker Registry";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        location /v2/ {
            proxy_pass http://docker-private;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Required by Docker Registry
            proxy_set_header Docker-Distribution-Api-Version registry/2.0;

            proxy_request_buffering off;
            proxy_read_timeout 900;
        }
    }

    ################################################################
    # DOCKER HUB PULL-THROUGH CACHE
    ################################################################

    server {
        listen 443 ssl;
        http2 on;
        server_name cache.home.arpa;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        auth_basic "Docker Cache";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        location /v2/ {

            # Rewrite official images:
            # /v2/busybox/... -> /v2/library/busybox/...
            if ($uri ~ "^/v2/([^/]+)/((manifests|blobs|tags)/.*)$") {
                rewrite ^/v2/([^/]+)/(.*)$ /v2/library/$1/$2 break;
            }

            proxy_pass http://docker-cache;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Docker-Distribution-Api-Version registry/2.0;

            proxy_request_buffering off;
            proxy_read_timeout 900;
        }
    }

    ################################################################
    # PYPI PULL-THROUGH CACHE (devpi)
    ################################################################

    server {
        listen 443 ssl;
        http2 on;
        server_name pypi.home.arpa;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # auth_basic "PyPI Cache";
        # auth_basic_user_file /etc/nginx/auth/.htpasswd;

        location / {
            proxy_pass http://pypi-cache;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_request_buffering off;
            proxy_read_timeout 900;
        }
    }
}

